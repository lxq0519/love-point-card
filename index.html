<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我们的积分小屋 💗</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#fff0f5,#ffe4ec,#fff7fa);
  color:#542b3a
}
.container{
  max-width:520px;
  margin:auto;
  padding:20px 16px 40px
}
.header{
  text-align:center;
  padding:20px 10px 14px
}
.heart{font-size:42px}
.header h1{
  margin:6px 0;
  font-size:28px
}
.subtitle{color:#a56b7e}
.card{
  background:rgba(255,255,255,.94);
  border-radius:24px;
  padding:22px;
  margin:16px 0;
  box-shadow:0 10px 30px rgba(190,90,120,.12)
}
.center{text-align:center}
label{
  display:block;
  margin:14px 0 7px;
  font-weight:600
}
select,input{
  width:100%;
  padding:14px;
  border:1px solid #f1c8d6;
  border-radius:14px;
  font-size:16px;
  background:#fff;
  outline:none
}
button{
  border:0;
  border-radius:14px;
  padding:13px 18px;
  font-size:16px;
  font-weight:600;
  cursor:pointer
}
.primary{
  background:#f45b91;
  color:white
}
.secondary{
  background:#fff0f5;
  color:#d94178
}
.full{
  width:100%;
  margin-top:18px
}
.notice{
  font-size:14px;
  line-height:1.8;
  color:#a56b7e;
  margin-top:15px
}
.hidden{display:none!important}
.points{
  background:linear-gradient(135deg,#ff6f9d,#f83f7c);
  color:white;
  text-align:center;
  border-radius:26px;
  padding:26px 18px
}
.points small{font-size:16px}
.number{
  font-size:68px;
  font-weight:800;
  line-height:1.1;
  margin:8px
}
.reward{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 0;
  border-bottom:1px solid #f7dce5
}
.reward:last-child{border-bottom:0}
.reward h3{margin:0 0 5px}
.cost{color:#ef5b8a}
.reward button{min-width:82px}
.record{
  padding:10px 0;
  border-bottom:1px solid #f5dfe6;
  font-size:14px
}
.footer{
  text-align:center;
  color:#b17b8d;
  padding:20px;
  font-size:13px
}
.row{
  display:flex;
  gap:10px
}
.row>*{flex:1}
.danger{
  background:#fff0f0;
  color:#b53d3d
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="heart">💗</div>
  <h1>我们的积分小屋</h1>
  <div class="subtitle">只属于我们两个人的小世界</div>
</div>

<section id="loginPage" class="card">

  <h2 class="center">💗 欢迎回来</h2>

  <label>请选择身份</label>

  <select id="role">
    <option value="girl">女朋友 · 黎子雅</option>
    <option value="boy">男朋友 · 林嘉钦</option>
  </select>

  <label>登录密码</label>

  <input
    id="password"
    type="password"
    inputmode="numeric"
    maxlength="4"
    placeholder="请输入密码"
  >

  <button
    class="primary full"
    onclick="login()"
  >
    进入我们的小世界
  </button>

  <div class="notice center">
    女朋友密码：1220<br>
    男朋友密码：0310
  </div>

  <div id="loginMsg"></div>

</section>


<section id="mainPage" class="hidden">

  <div class="card points">

    <small id="pointsOwner">
      黎子雅的当前积分
    </small>

    <div class="number" id="points">
      0
    </div>

    <div>
      ❤️ 每一分都是嘉钦给你的心意
    </div>

  </div>


  <div class="card center">

    <div style="font-size:22px">
      💕 我们已经在一起
    </div>

    <h2
      id="days"
      style="font-size:38px;margin:8px 0"
    >
      0 天
    </h2>

    <div class="subtitle">
      从 2026 年 3 月 10 日开始
    </div>

  </div>


  <div id="girlPanel">

    <div class="card">

      <h2>🎁 我的奖励</h2>

      <div id="rewards"></div>

    </div>

  </div>


  <div id="boyPanel" class="hidden">

    <div class="card">

      <h2>💝 给子雅加积分</h2>

      <div class="row">

        <input
          id="changePoints"
          type="number"
          inputmode="numeric"
          placeholder="积分"
        >

        <button
          class="primary"
          onclick="addPoints()"
        >
          增加
        </button>

      </div>

      <button
        class="secondary full"
        onclick="subtractPoints()"
      >
        扣除积分
      </button>

    </div>


    <div class="card">

      <h2>🎁 奖励管理</h2>

      <input
        id="rewardName"
        placeholder="奖励名称，例如：奶茶一杯 🧋"
      >

      <input
        id="rewardCost"
        type="number"
        inputmode="numeric"
        placeholder="需要多少积分"
        style="margin-top:10px"
      >

      <button
        class="primary full"
        onclick="addReward()"
      >
        ＋ 添加奖励
      </button>

      <div
        id="adminRewards"
        style="margin-top:12px"
      ></div>

    </div>


    <div class="card">

      <h2>📖 全部记录</h2>

      <div id="adminRecords"></div>

    </div>

  </div>


  <div class="card">

    <h2>💌 我们的记录</h2>

    <div id="records"></div>

  </div>


  <div class="center">

    <button
      class="secondary"
      onclick="logout()"
    >
      退出登录
    </button>

  </div>

</section>


<div class="footer">
  林嘉钦 ❤️ 黎子雅<br>
  Love is made of little moments.
</div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>


<script>

const USERS = {

  girl: {
    email: "3751821168@qq.com",
    name: "黎子雅"
  },

  boy: {
    email: "19731170879@163.com",
    name: "林嘉钦"
  }

};


const START_DATE =
  new Date("2026-03-10T00:00:00");


const defaultRewards = [

  {
    id:1,
    name:"奶茶一杯 🧋",
    cost:50
  },

  {
    id:2,
    name:"陪你看电影 🎬",
    cost:100
  },

  {
    id:3,
    name:"请你吃大餐 🍰",
    cost:200
  }

];


const firebaseConfig = {

  apiKey:
    "AIzaSyDl6HgvheJZe18f1Vj_D2NirG3npTaFwB0",

  authDomain:
    "love-point-card.firebaseapp.com",

  databaseURL:
    "https://love-point-card-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "love-point-card",

  storageBucket:
    "love-point-card.firebasestorage.app",

  messagingSenderId:
    "979855456387",

  appId:
    "1:979855456387:web:42560a01bb5d6dfddd43b6",

  measurementId:
    "G-41H1TDBTPK"

};


firebase.initializeApp(firebaseConfig);


const auth =
  firebase.auth();


const db =
  firebase.database();


const dataRef =
  db.ref("loveBank");


let data = {

  points:0,

  rewards:defaultRewards,

  records:[]

};


let currentRole = null;


let dataListenerAttached = false;



/* =========================
   登录后的界面
========================= */

function setLoggedInUI(role){

  currentRole = role;

  document
    .getElementById("loginPage")
    .classList
    .add("hidden");

  document
    .getElementById("mainPage")
    .classList
    .remove("hidden");


  document
    .getElementById("girlPanel")
    .classList
    .toggle(
      "hidden",
      role !== "girl"
    );


  document
    .getElementById("boyPanel")
    .classList
    .toggle(
      "hidden",
      role !== "boy"
    );


  render();

}



/* =========================
   退出登录后的界面
========================= */

function setLoggedOutUI(){

  currentRole = null;

  document
    .getElementById("mainPage")
    .classList
    .add("hidden");


  document
    .getElementById("loginPage")
    .classList
    .remove("hidden");


  document
    .getElementById("password")
    .value = "";

}



/* =========================
   Firebase 实时监听
========================= */

function startDataListener(){

  if(dataListenerAttached)
    return;


  dataListenerAttached = true;


  dataRef.on(

    "value",

    function(snapshot){

      if(snapshot.exists()){

        data = snapshot.val();


        if(!Array.isArray(data.rewards)){

          data.rewards =
            defaultRewards;

        }


        if(!Array.isArray(data.records)){

          data.records = [];

        }


        if(typeof data.points !== "number"){

          data.points =
            Number(data.points) || 0;

        }

      }

      else{

        data = {

          points:0,

          rewards:
            defaultRewards,

          records:[]

        };


        dataRef
          .set(data)
          .catch(function(error){

            console.error(
              "初始化数据失败：",
              error
            );

          });

      }


      render();

    },

    function(error){

      console.error(
        "读取数据库失败：",
        error
      );

    }

  );

}



/* =========================
   保存数据到 Firebase
========================= */

function save(){

  if(!auth.currentUser){

    alert("请先登录");

    return Promise.reject(
      new Error("未登录")
    );

  }


  return dataRef
    .set(data)

    .catch(function(error){

      console.error(
        "保存失败：",
        error
      );

      alert(
        "数据保存失败：" +
        error.message
      );

      throw error;

    });

}



/* =========================
   登录
========================= */

function login(){

  const role =
    document
      .getElementById("role")
      .value;


  const password =
    document
      .getElementById("password")
      .value;


  const msg =
    document
      .getElementById("loginMsg");


  const email =
    USERS[role].email;


  if(!password){

    msg.innerHTML =
      '<div class="notice center" style="color:#c43d61">' +
      '请输入密码 💗' +
      '</div>';

    return;

  }


  msg.innerHTML =
    '<div class="notice center">' +
    '正在登录，请稍等…… 💗' +
    '</div>';


  auth
    .signInWithEmailAndPassword(
      email,
      password
    )

    .then(function(){

      setLoggedInUI(role);

    })

    .catch(function(error){

      console.error(
        "登录失败：",
        error
      );


      let text =
        "账号或密码不正确，请检查后再试。";


      if(
        error.code ===
        "auth/too-many-requests"
      ){

        text =
          "尝试次数太多，请稍等一会儿再试。";

      }

      else if(
        error.code ===
        "auth/user-disabled"
      ){

        text =
          "这个账号已被禁用。";

      }


      msg.innerHTML =
        '<div class="notice center" style="color:#c43d61">' +
        escapeHtml(text) +
        '</div>';

    });

}



/* =========================
   退出登录
========================= */

function logout(){

  auth
    .signOut()

    .then(function(){

      setLoggedOutUI();

      document
        .getElementById("loginMsg")
        .innerHTML = "";

    });

}



/* =========================
   Firebase 登录状态
========================= */

auth.onAuthStateChanged(
  function(user){

    if(!user){

      setLoggedOutUI();

      return;

    }


    let role = null;


    if(
      user.email ===
      USERS.girl.email
    ){

      role = "girl";

    }

    else if(
      user.email ===
      USERS.boy.email
    ){

      role = "boy";

    }

    else{

      auth.signOut();

      return;

    }


    setLoggedInUI(role);


    startDataListener();

  }
);



/* =========================
   页面渲染
========================= */

function render(){

  document
    .getElementById("points")
    .textContent =
    data.points;


  document
    .getElementById("pointsOwner")
    .textContent =
    "黎子雅的当前积分";


  const days =
    Math.max(

      0,

      Math.floor(
        (new Date() - START_DATE)
        / 86400000
      )

    );


  document
    .getElementById("days")
    .textContent =
    days + " 天";



  document
    .getElementById("rewards")
    .innerHTML =

    data.rewards

      .map(function(r){

        return `

          <div class="reward">

            <div>

              <h3>
                ${escapeHtml(r.name)}
              </h3>

              <div class="cost">
                ${r.cost} 积分
              </div>

            </div>

            <button
              class="primary"
              onclick="redeem(${Number(r.id)})"
            >
              兑换
            </button>

          </div>

        `;

      })

      .join("");



  document
    .getElementById("adminRewards")
    .innerHTML =

    data.rewards

      .map(function(r){

        return `

          <div class="reward">

            <div>

              <b>
                ${escapeHtml(r.name)}
              </b>

              <div class="cost">
                ${r.cost} 积分
              </div>

            </div>

            <button
              class="secondary danger"
              onclick="deleteReward(${Number(r.id)})"
            >
              删除
            </button>

          </div>

        `;

      })

      .join("");



  const records =

    data.records.length

      ?

      data.records
        .slice()
        .reverse()

        .map(function(x){

          return `

            <div class="record">

              ${escapeHtml(x.text)}

              <br>

              <span style="color:#ad7a8c">

                ${escapeHtml(x.time)}

              </span>

            </div>

          `;

        })

        .join("")

      :

      '<div class="notice">' +
      '还没有记录 💕' +
      '</div>';



  document
    .getElementById("records")
    .innerHTML =
    records;


  document
    .getElementById("adminRecords")
    .innerHTML =
    records;

}



/* =========================
   男朋友增加积分
========================= */

function addPoints(){

  if(currentRole !== "boy")
    return;


  const n =
    Number(
      document
        .getElementById("changePoints")
        .value
    );


  if(
    !Number.isFinite(n) ||
    n <= 0
  ){

    return alert(
      "请输入正确的积分"
    );

  }


  const amount =
    Math.floor(n);


  data.points += amount;


  data.records.push({

    text:
      `嘉钦给子雅增加了 ${amount} 积分 💗`,

    time:
      now()

  });


  document
    .getElementById("changePoints")
    .value = "";


  save();

  render();

}



/* =========================
   男朋友扣积分
========================= */

function subtractPoints(){

  if(currentRole !== "boy")
    return;


  const n =
    Number(
      document
        .getElementById("changePoints")
        .value
    );


  if(
    !Number.isFinite(n) ||
    n <= 0
  ){

    return alert(
      "请输入正确的积分"
    );

  }


  const amount =
    Math.floor(n);


  data.points =
    Math.max(
      0,
      data.points - amount
    );


  data.records.push({

    text:
      `扣除了 ${amount} 积分`,

    time:
      now()

  });


  document
    .getElementById("changePoints")
    .value = "";


  save();

  render();

}



/* =========================
   女朋友兑换奖励
========================= */

function redeem(id){

  if(currentRole !== "girl")
    return;


  const r =
    data.rewards.find(
      function(x){

        return Number(x.id)
          === Number(id);

      }
    );


  if(!r)
    return;


  if(data.points < r.cost){

    return alert(
      "积分不够哦 💗"
    );

  }


  if(
    !confirm(
      `确定用 ${r.cost} 积分兑换「${r.name}」吗？`
    )
  ){

    return;

  }


  data.points -= r.cost;


  data.records.push({

    text:
      `黎子雅兑换了「${r.name}」，-${r.cost} 积分 🎁`,

    time:
      now()

  });


  save();

  render();


  alert(
    "兑换成功啦！💕"
  );

}



/* =========================
   添加奖励
========================= */

function addReward(){

  if(currentRole !== "boy")
    return;


  const name =
    document
      .getElementById("rewardName")
      .value
      .trim();


  const cost =
    Number(
      document
        .getElementById("rewardCost")
        .value
    );


  if(
    !name ||
    !Number.isFinite(cost) ||
    cost <= 0
  ){

    return alert(
      "请填写奖励名称和正确的积分"
    );

  }


  data.rewards.push({

    id:
      Date.now(),

    name:
      name,

    cost:
      Math.floor(cost)

  });


  document
    .getElementById("rewardName")
    .value = "";


  document
    .getElementById("rewardCost")
    .value = "";


  save();

  render();

}



/* =========================
   删除奖励
========================= */

function deleteReward(id){

  if(currentRole !== "boy")
    return;


  data.rewards =
    data.rewards.filter(
      function(r){

        return Number(r.id)
          !== Number(id);

      }
    );


  save();

  render();

}



/* =========================
   当前时间
========================= */

function now(){

  return new Date()
    .toLocaleString(
      "zh-CN",
      {
        hour12:false
      }
    );

}



/* =========================
   防止文字注入
========================= */

function escapeHtml(s){

  return String(s)
    .replace(
      /[&<>"']/g,
      function(m){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"

        }[m];

      }
    );

}



/* =========================
   回车登录
========================= */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter")
        login();

    }
  );


render();

</script>

</body>
</html>
